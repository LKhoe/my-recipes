<h1>My favourite pancakes</h1>
<p>These are the fluffiest pancakes I've ever made. Mix 200g flour, 2 eggs, 300ml milk and a
pinch of salt. Whisk until smooth, then fry spoonfuls in a hot buttered pan for two minutes a
side. Serves 2.</p>

# My Recipes — app only.
# Postgres, photo storage (S3, Garage) and the LLM gateway come from the LocalInfra project (../LocalInfra):
# start it first, then provision this app once with
#   LocalInfra/scripts/new-project.sh my_recipes --no-redis --s3
# and copy the printed variables into this project's .env. See DEPLOY.md.
services:
  my-recipes:
    container_name: my-recipes
    # Fixed tag so deploy.sh can keep the previous build as my-recipes:previous for --rollback
    image: my-recipes:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      # yarg-aggregator already owns 3000 on the Pi
      - "${PORT:-3001}:3000"
    environment:
      # Database — LocalInfra Postgres; DATABASE_URL carries this app's own role
      # (create it with: LocalInfra/scripts/new-project.sh my_recipes --no-redis)
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL in .env}
      - POSTGRES_HOST=${POSTGRES_HOST:-localinfra-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      # Photos — LocalInfra S3 (Garage); this app's key can only read/write its own bucket
      - S3_ENDPOINT=${S3_ENDPOINT:-http://localinfra-s3:3900}
      - S3_REGION=${S3_REGION:-garage}
      - S3_BUCKET=${S3_BUCKET:-my-recipes}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      # App
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NODE_ENV=production
      # Server-side "today" (meal plan week, dates) must be the household's, not UTC
      - TZ=${TZ:-America/Sao_Paulo}
      # Better Auth
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # LLM import fallback — LocalInfra's LLM gateway (provision-app.sh --llm)
      - LLM_BASE_URL=${LLM_BASE_URL:-http://localinfra-llm:4000/v1}
      - LLM_API_KEY=${LLM_API_KEY}
      # YouTube import
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      # Alexa API surface (SPEC §9.1) — shared-secret token, no device pairing in v1
      - ALEXA_API_TOKEN=${ALEXA_API_TOKEN}
    labels:
      # Shown on the Container Health page (resource map, guides)
      - localinfra.url=${NEXT_PUBLIC_APP_URL:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - localinfra_postgres
      - localinfra_s3
      - localinfra_llm
      # LocalInfra's Cloudflare tunnel reaches the app here: http://my-recipes:3000
      - localinfra_tunnel
    deploy:
      resources:
        limits:
          # sharp + the WASM HEIC decoder spike well above idle on a full-size iPhone photo
          memory: 768M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Created by the LocalInfra project (start it first)
  localinfra_postgres:
    external: true
  localinfra_s3:
    external: true
  localinfra_llm:
    external: true
  localinfra_tunnel:
    external: true
